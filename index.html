<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stavian Metal</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Inter, Arial, sans-serif;
      color: #f8fafc;
    }

    body {
      overflow-x: hidden;
      background: #000000;
    }

    .background-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 24px;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #f8fafc;
      background: transparent;
      padding: 6px 16px 6px 6px;
      border-radius: 999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: transparent;
      padding: 6px;
      border-radius: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .tab-btn {
      border: 0;
      padding: 10px 16px;
      border-radius: 9px;
      background: transparent;
      color: #cbd5e1;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .tab-btn:hover {
      background: transparent;
    }

    .tab-btn.active {
      background: transparent;
      color: #fff;
    }

    .dashboard {
      background: transparent;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      min-height: calc(100vh - 120px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .title-block h1 {
      margin: 0;
      color: #f8fafc;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .title-block p {
      margin: 6px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .filters {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .input,
    .select {
      height: 40px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      background: transparent;
      color: #f8fafc;
      backdrop-filter: blur(10px);
    }

    .select option {
      color: #f8fafc;
    }

    .input {
      min-width: 260px;
    }

    .refresh-btn {
      height: 40px;
      border: 0;
      border-radius: 9px;
      padding: 0 14px;
      background: #3b82f6;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #2563eb;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: minmax(0, 300px);
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-card {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 14px;
      background: transparent;
      backdrop-filter: blur(10px);
    }

    .metric-label {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .metric-value {
      margin-top: 6px;
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
    }

    .bbc-news-container {
      background: transparent;
      color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .bbc-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .bbc-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .bbc-panel-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      border-bottom: 2px solid #ef4444;
      padding-bottom: 10px;
      margin: 0 0 10px 0;
    }

    .bbc-panel-title.aluminum {
      border-bottom-color: #3b82f6;
    }

    .bbc-panel-title.copper {
      border-bottom-color: #f97316;
    }

    .bbc-panel-title.zinc {
      border-bottom-color: #eab308;
    }

    .bbc-card {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
    }

    .bbc-card:last-child {
      border-bottom: none;
    }

    .bbc-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 8px 0;
      color: #ffffff;
      transition: color 0.2s;
    }

    .bbc-title-link {
      text-decoration: none;
    }

    .bbc-title-link:hover .bbc-title {
      color: #b80000;
    }

    .bbc-summary {
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
      margin: 0 0 12px 0;
      white-space: pre-line;
    }

    .bbc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: #94a3b8;
      align-items: center;
    }

    .bbc-source {
      font-weight: 600;
      color: #e2e8f0;
    }

    .bbc-read-more {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      padding: 4px 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      transition: background 0.2s;
    }

    .bbc-read-more:hover {
      background: transparent;
    }

    .live-feeds-container {
      margin-top: 20px;
    }
    .feed-filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px;
      background: transparent;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
    .live-feeds-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .feed-card {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .feed-card:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      border-color: #3b82f6;
    }
    .feed-card.high-risk {
      border-color: rgba(248, 113, 113, 0.5);
      background: rgba(239, 68, 68, 0.1);
    }
    .feed-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .feed-title {
      font-size: 16px;
      font-weight: 700;
      color: #93c5fd;
      text-decoration: none;
      line-height: 1.4;
    }
    .feed-title:hover {
      text-decoration: underline;
    }
    .feed-score {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid;
      font-weight: 700;
      white-space: nowrap;
    }
    .score-high { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: rgba(248, 113, 113, 0.5); }
    .score-med { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border-color: rgba(251, 191, 36, 0.5); }
    .score-low { background: transparent; color: #cbd5e1; border-color: rgba(255, 255, 255, 0.2); }
    .feed-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
      font-size: 12px;
    }
    .feed-badge {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      border-radius: 999px;
      padding: 4px 10px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .feed-time {
      color: #94a3b8;
      font-weight: 500;
    }
    .feed-summary {
      font-size: 14px;
      color: #cbd5e1;
      margin: 0;
      line-height: 1.5;
    }

    .empty {
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 50px 18px;
      text-align: center;
      color: #94a3b8;
      font-weight: 700;
      background: transparent;
      backdrop-filter: blur(10px);
      line-height: 1.6;
    }

    .generic-table-wrap {
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      background: transparent;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    td,
    th {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px;
      vertical-align: middle;
      font-size: 13.5px;
      white-space: pre-line;
      color: #f8fafc;
    }

    td:last-child,
    th:last-child {
      border-right: none;
    }

    tr:hover td {
      background: transparent;
    }

    tr:first-child td,
    thead th {
      background: transparent;
      color: #60a5fa;
      font-weight: 800;
      text-align: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .cell-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }

    .cb-green {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    .cb-red {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .cb-yellow {
      background: rgba(234, 179, 8, 0.2);
      color: #fde047;
    }

    .cb-blue {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
    }

    .cb-gray {
      background: transparent;
      color: #cbd5e1;
    }

    .text-green {
      color: #10b981;
      font-weight: 700;
    }

    .text-red {
      color: #ef4444;
      font-weight: 700;
    }

    .text-orange {
      color: #f59e0b;
      font-weight: 700;
    }

    .col-al {
      background: rgba(59, 130, 246, 0.1) !important;
    }

    .col-cu {
      background: rgba(249, 115, 22, 0.1) !important;
    }

    .col-zn {
      background: rgba(234, 179, 8, 0.1) !important;
    }

    tr:hover td.col-al {
      background: rgba(59, 130, 246, 0.2) !important;
    }

    tr:hover td.col-cu {
      background: rgba(249, 115, 22, 0.2) !important;
    }

    tr:hover td.col-zn {
      background: rgba(234, 179, 8, 0.2) !important;
    }

    tr:first-child td.col-al {
      background: rgba(59, 130, 246, 0.2) !important;
      border-bottom: 2px solid rgba(59, 130, 246, 0.3) !important;
    }

    tr:first-child td.col-cu {
      background: rgba(249, 115, 22, 0.2) !important;
      border-bottom: 2px solid rgba(249, 115, 22, 0.3) !important;
    }

    tr:first-child td.col-zn {
      background: rgba(234, 179, 8, 0.2) !important;
      border-bottom: 2px solid rgba(234, 179, 8, 0.3) !important;
    }

    .error-box {
      border: 1px dashed #ef4444;
      border-radius: 10px;
      padding: 32px 18px;
      text-align: center;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.1);
      font-weight: 700;
      line-height: 1.6;
    }

    @media (max-width: 980px) {

      .summary-grid,
      .bbc-grid {
        grid-template-columns: 1fr;
      }

      .navbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .input {
        min-width: 100%;
      }
    }

    .desk-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .desk-grid { grid-template-columns: 1fr; }
    }
    .desk-card {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .desk-card-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 4px 0;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .desk-card-desc {
      font-size: 13px;
      color: #94a3b8;
      margin: 0 0 16px 0;
      line-height: 1.5;
    }
    .desk-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .desk-tab {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #cbd5e1;
    }
    .desk-tab.active {
      background: #3b82f6;
      color: #fff;
      border-color: #2563eb;
    }
    .desk-pill {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .source-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .source-grid { grid-template-columns: 1fr; }
    }
    .source-item {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      border-radius: 12px;
      padding: 16px;
      transition: all 0.2s;
    }
    .source-item:hover { border-color: #60a5fa; }
    .source-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .source-name {
      font-weight: 700;
      color: #f8fafc;
      font-size: 14px;
      line-height: 1.4;
      margin: 0;
    }
    .source-priority {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
      font-weight: 600;
    }
    .pri-high { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border-color: rgba(248, 113, 113, 0.5); }
    .pri-med { background: rgba(245, 158, 11, 0.1); color: #fcd34d; border-color: rgba(251, 191, 36, 0.5); }
    .pri-low { background: #0f172a; color: #cbd5e1; border-color: rgba(255, 255, 255, 0.2); }
    
    .source-use { font-size: 13px; color: #cbd5e1; margin: 12px 0; line-height: 1.5; }
    .source-mode { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }
    .source-actions { display: flex; gap: 8px; }
    .source-btn {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-open { border: 1px solid rgba(255, 255, 255, 0.1); background: #0f172a; color: #f8fafc; }
    .btn-open:hover { background: transparent; }
    .btn-note { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: none; }
    .btn-note:hover { background: rgba(59, 130, 246, 0.2); }

    .workflow-item {
      display: flex;
      gap: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .wf-time {
      flex-shrink: 0;
      width: 80px;
      font-size: 11px;
      font-weight: 700;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 8px;
    }
    .wf-content { min-width: 0; }
    .wf-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .wf-body { font-size: 13px; color: #cbd5e1; margin-bottom: 8px; line-height: 1.5; }
    .wf-source { font-size: 11px; color: #94a3b8; }

    .alert-rule {
      border: 1px solid;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .rule-red { background: rgba(239, 68, 68, 0.1); border-color: rgba(248, 113, 113, 0.5); color: #fca5a5; }
    .rule-amber { background: rgba(245, 158, 11, 0.1); border-color: rgba(251, 191, 36, 0.5); color: #fcd34d; }
    .rule-slate { background: #0f172a; border-color: rgba(255, 255, 255, 0.2); color: #cbd5e1; }
    .rule-label { font-weight: 600; font-size: 13px; }
    .rule-impact { font-size: 11px; margin-top: 4px; }

    .checklist-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .checklist-item input { margin-top: 3px; }
    .checklist-item.done span { text-decoration: line-through; color: #94a3b8; }

    .reduced-item {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
    }
    .red-name { font-weight: 700; font-size: 13px; }
    .red-action { font-size: 11px; font-weight: 600; color: #93c5fd; margin-top: 4px; }
    .red-reason { font-size: 11px; color: #cbd5e1; margin-top: 4px; }

    .desk-textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      padding: 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: vertical;
    }
    .desk-textarea:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(96,165,250,0.2);
    }
    .desk-btn-primary {
      width: 100%;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
    }
    .desk-btn-primary:hover { background: #2563eb; }

    .blink-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 2s infinite;
    }
    .blink-card {
      border-color: rgba(248, 113, 113, 0.5) !important;
      animation: blink-card 2s infinite;
    }
    @keyframes blink { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} 50%{box-shadow:0 0 0 4px rgba(239,68,68,.5)} }
    @keyframes blink-card { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} 50%{box-shadow:0 0 0 4px rgba(239,68,68,.5)} }
    
    .feed-container { max-height: 500px; overflow-y: auto; padding-right: 4px; }
    .feed-container::-webkit-scrollbar { width: 6px; }
    .feed-container::-webkit-scrollbar-track { background: transparent; }
    .feed-container::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
    
    .flex-row-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  </style>
</head>

<body>
  <!-- <video removed> -->

  <main class="page">
    <nav class="navbar">
      <div class="brand">
        <img class="brand-mark"
          src="https://raw.githubusercontent.com/radiant-light-2785/stavian/458b8ee6a1ea8d167cfe172c8df42fbc0b7bd1bf/359349825_197987636573909_8836727906488842418_n.jpg"
          alt="Logo" />
        <div>Stavian Metal</div>

    async function loadNewsPayload() {

        .order('news_date', { ascending: false })

      const rows = (data || []).map(item => ({

        date: formatDateVN(item.news_date),
        aluminum: {
          summary: item.al_summary || '',
          source: item.al_source || '',
          time: item.al_time || ''

        copper: {
          summary: item.cu_summary || '',
          source: item.cu_source || '',
          time: item.cu_time || ''
        },
        zinc: {

          time: item.zn_time || ''

      }));

      return {
        success: true,
        sheet: 'News',
        updatedAt: new Date().toLocaleString('vi-VN'),
        count: rows.length,
        rows,
        dates: [...new Set(rows.map(row => row.date).filter(Boolean))]

    function renderCurrentPayload() {
      if (!currentPayload) return;

      if (!currentPayload.success) {
        showPayloadError(currentPayload);
        return;
      }

      metricUpdated.textContent = currentPayload.updatedAt || '-';

      if (currentPayload.sheet === 'News') {
        renderNews(currentPayload);
      } else if (currentPayload.sheet === 'NewsUpdate') {
        renderNewsUpdate(currentPayload);
      } else {
        renderGenericTable(currentPayload);
      }
    }

    function renderNews(payload) {
      const query = normalize(searchInput.value);
      const selectedDate = dateFilter.value;

      updateDateOptions(payload.dates || []);

      let rows = payload.rows || [];

      if (selectedDate) {
        rows = rows.filter(row => row.date === selectedDate);
      }

      if (query) {
        rows = rows.filter(row => {
          const haystack = normalize([
            row.date,
            'nhôm', row.aluminum?.summary, row.aluminum?.source, row.aluminum?.time,
            'đồng', row.copper?.summary, row.copper?.source, row.copper?.time,
            'kẽm', row.zinc?.summary, row.zinc?.source, row.zinc?.time
          ].join(' '));
          return haystack.includes(query);
        });
      }

      if (!rows.length) {
        contentArea.innerHTML = '<div class="empty">Không có dữ liệu phù hợp.</div>';
        return;
      }

      contentArea.innerHTML = `
        <div class="bbc-news-container">
          <div class="bbc-grid">
            <section class="bbc-panel">
              <h2 class="bbc-panel-title copper">Đồng</h2>
              ${rows.map(row => renderBbcCard(row.date, row.copper)).join('')}
            </section>
            <section class="bbc-panel">
              <h2 class="bbc-panel-title aluminum">Nhôm</h2>
              ${rows.map(row => renderBbcCard(row.date, row.aluminum)).join('')}
            </section>
            <section class="bbc-panel">
              <h2 class="bbc-panel-title zinc">Kẽm</h2>
              ${rows.map(row => renderBbcCard(row.date, row.zinc)).join('')}
            </section>
          </div>
        </div>
      `;
    }

    function renderBbcCard(date, data) {
      if (!data || !data.summary) return '';

      const rawSummary = data.summary;
      const lines = rawSummary.split('\n').map(l => l.trim()).filter(l => l);
      const title = lines.length > 0 ? lines[0] : 'Không có tiêu đề';
      const summaryText = lines.slice(1).join('\n');

      const source = data.source ? data.source : '';
      let sourceName = source;
      let sourceLink = '';

      if (source.includes('http')) {
        const urlMatch = source.match(/https?:\/\/[^\s]+/);
        if (urlMatch) {
          sourceLink = urlMatch[0];
          sourceName = source.replace(sourceLink, '').trim();
          if (!sourceName) {
            try {
              sourceName = new URL(sourceLink).hostname.replace('www.', '');
            } catch (e) {
              sourceName = 'Link';
            }
          }
        }
      }

      const time = data.time ? data.time : '';

      let titleHtml = `<h3 class="bbc-title">${escapeHtml(title)}</h3>`;
      if (sourceLink) {
        titleHtml = `<a href="${sourceLink}" target="_blank" class="bbc-title-link">${titleHtml}</a>`;
      }

      const summaryHtml = summaryText ? `<p class="bbc-summary">${escapeHtml(summaryText)}</p>` : '';
      const sourceNameHtml = sourceName ? `<span class="bbc-source">${escapeHtml(sourceName)}</span>` : '';
      const readMoreHtml = sourceLink ? `<a href="${sourceLink}" target="_blank" class="bbc-read-more">Chi tiết hơn</a>` : '';

      return `
        <article class="bbc-card">
          ${titleHtml}
          ${summaryHtml}
          <div class="bbc-meta">
            <span>${escapeHtml(date)} ${escapeHtml(time)}</span>
            ${sourceNameHtml}
            ${readMoreHtml}
          </div>
        </article>
      `;
    }

    function renderGenericTable(payload) {
      const values = payload.values || [];
      const query = normalize(searchInput.value);
      let filteredValues = values;

      if (query) {
        filteredValues = values.filter((row, idx) => idx === 0 || normalize(row.join(' ')).includes(query));
      }

      if (!filteredValues.length) {
        contentArea.innerHTML = '<div class="empty">Không có dữ liệu phù hợp.</div>';
        return;
      }

      const numCols = filteredValues[0] ? filteredValues[0].length : 0;
      const rowSpans = [];
      const skip = [];
      
      for (let r = 0; r < filteredValues.length; r++) {
        rowSpans[r] = [];
        skip[r] = [];
        for (let c = 0; c < numCols; c++) {
          rowSpans[r][c] = 1;
          skip[r][c] = false;
        }
      }

      const isView = payload.sheet === 'View';
      const noMergeCols = isView ? [4, 6, 8, 12, 13, 14] : [];

      for (let c = 0; c < numCols; c++) {
        if (noMergeCols.includes(c)) continue;
        for (let r = 1; r < filteredValues.length; r++) {
          if (skip[r][c]) continue;
          let span = 1;
          const val = String(filteredValues[r][c] || '').trim();
          
          if (val !== '') { 
            for (let nextR = r + 1; nextR < filteredValues.length; nextR++) {
              const nextVal = String(filteredValues[nextR][c] || '').trim();
              const baseCol0 = String(filteredValues[r][0] || '').trim();
              const nextCol0 = String(filteredValues[nextR][0] || '').trim();
              
              if (nextVal === val && baseCol0 === nextCol0) {
                span++;
                skip[nextR][c] = true;
              } else {
                break;
              }
            }
          }
          rowSpans[r][c] = span;
        }
      }

      const tbodyHtml = filteredValues.map((row, rowIndex) => {
        const trHtml = row.map((cell, colIndex) => {
          if (rowIndex > 0 && skip[rowIndex][colIndex]) return '';
          
          let cls = '';
          if (isView) {
             if ([3, 4, 12].includes(colIndex)) cls = 'col-al';
             else if ([5, 6, 13].includes(colIndex)) cls = 'col-cu';
             else if ([7, 8, 14].includes(colIndex)) cls = 'col-zn';
          }
          
          const spanAttr = (rowIndex > 0 && rowSpans[rowIndex][colIndex] > 1) 
                         ? ` rowspan="${rowSpans[rowIndex][colIndex]}"` : '';
          const classAttr = cls ? ` class="${cls}"` : '';
          
          return `<td${spanAttr}${classAttr}>${formatTableCell(cell, rowIndex === 0)}</td>`;
        }).join('');
        return `<tr>${trHtml}</tr>`;
      }).join('');

      contentArea.innerHTML = `
        <div class="generic-table-wrap">
          <table>
            <tbody>
              ${tbodyHtml}
            </tbody>
          </table>
        </div>
      `;
    }

    function formatTableCell(text, isHeader) {
      if (text === null || text === undefined) return '';
      let val = escapeHtml(String(text).trim());
      if (isHeader) return val;

      const lower = val.toLowerCase();
      if (lower === '↑ tăng' || lower === 'tăng') return '<span class="cell-badge cb-green">↑ Tăng</span>';
      if (lower === '↓ giảm' || lower === 'giảm') return '<span class="cell-badge cb-red">↓ Giảm</span>';
      if (lower === '↕ mixed' || lower === 'mixed') return '<span class="cell-badge cb-blue">↕ Mixed</span>';
      if (lower === 'đúng') return '<span class="cell-badge cb-green">Đúng</span>';
      if (lower === 'sai') return '<span class="cell-badge cb-red">Sai</span>';
      if (lower === 'gần đúng') return '<span class="cell-badge cb-yellow">Gần đúng</span>';
      if (lower === 'sideway' || lower === 'sideways') return '<span class="cell-badge cb-gray">Sideway</span>';
      if (lower === '-') return '<span class="cell-badge cb-gray">-</span>';

      val = val.replace(/(tăng)/gi, '<span class="text-green">$1</span>');
      val = val.replace(/(giảm)/gi, '<span class="text-red">$1</span>');
      val = val.replace(/(sideway)/gi, '<span class="text-orange">$1</span>');
      return val;
    }

    function updateDateOptions(dates) {
      const currentValue = dateFilter.value;
      const sortedDates = [...dates].sort((a, b) => parseDateForSort(b).localeCompare(parseDateForSort(a)));
      const options = ['<option value="">Tất cả ngày</option>']
        .concat(sortedDates.map(date => `<option value="${escapeHtml(date)}">${escapeHtml(date)}</option>`));
      dateFilter.innerHTML = options.join('');
      if (dates.includes(currentValue)) dateFilter.value = currentValue;
    }

    function groupByDate(rows) {
      return rows.reduce((acc, row) => {
        const key = row.date || 'Chưa có ngày';
        if (!acc[key]) acc[key] = [];
        acc[key].push(row);
        return acc;
      }, {});
    }

    function showPayloadError(error) {
      const message = error && error.message ? error.message : (error.error || 'Không rõ lỗi.');
      contentArea.innerHTML = `
        <div class="error-box">
          Không tải được dữ liệu:<br/>
          ${escapeHtml(message)}
        </div>
      `;
    }

    let liveFeedsCategory = 'Tất cả';

    function scoreFeed(item){
      const t=(item.title+' '+(item.summary||'')).toLowerCase(); let score=0, cat='Watch';
      if(/tariff|sanction|section 232|section 301|white house|ustr|trump/.test(t)){score+=5; cat='Policy';}
      if(/strike|shutdown|force majeure|export ban|curtailment|smelter|mine|refinery|output|production/.test(t)){score+=4; cat='Supply';}
      if(/inventory|inventories|stocks|warehouse|warrant|backwardation|contango|cash-3m/.test(t)){score+=3; cat='Inventory';}
      if(/china|shfe|smm|premium|arbitrage|property|stimulus|pmi/.test(t)){score+=2; cat='China';}
      if(/fed|powell|cpi|ppi|payrolls|dxy|dollar|yields|inflation/.test(t)){score+=2; cat='Macro';}
      if(/forecast|opinion|technical|market talk|preview/.test(t)){score-=3;}
      return {score, category:cat};
    }

    async function fetchFederalRegister(){
      const url='https://www.federalregister.gov/api/v1/documents.json?conditions%5Bterm%5D=(copper%20OR%20aluminum%20OR%20aluminium%20OR%20zinc%20OR%20tariff%20OR%20section%20232%20OR%20section%20301)&order=newest&per_page=5';
      const res=await fetch(url); if(!res.ok) throw new Error('Federal Register API lỗi');
      const data=await res.json();
      return (data.results||[]).map(d=>{ const scored=scoreFeed({title:d.title, summary:d.abstract||''}); return {title:d.title, source:'Federal Register', time:d.publication_date, url:d.html_url, category:scored.category, score:scored.score, summary:d.abstract || d.type || 'Official legal document'}; });
    }

    async function fetchGdelt(){
      const query=encodeURIComponent('(copper OR aluminium OR aluminum OR zinc) (LME OR smelter OR mine OR tariff OR China OR inventory OR strike)');
      const url=`https://api.gdeltproject.org/api/v2/doc/doc?query=${query}&mode=artlist&maxrecords=10&format=json&sort=hybridrel`;
      const res=await fetch(url); if(!res.ok) throw new Error('GDELT API lỗi');
      const data=await res.json();
      return (data.articles||[]).map(a=>{ const scored=scoreFeed({title:a.title, summary:a.seendate}); return {title:a.title, source:'GDELT', time:a.seendate || 'N/A', url:a.url, category:scored.category, score:scored.score, summary:'Public web scan.'}; });
    }

    function mockCoreFeed(){
      return [

        {title:'Mô phỏng: LME copper stocks move sharply; check cancelled warrants and cash-3M spread', source:'Workflow reminder', time:'Live check', url:'https://www.lme.com/market-data/reports-and-data', category:'Inventory', score:6, summary:'Nếu có giá chạy mạnh, mở LSEG LME data trước, LME official chỉ làm backup.'},
        {title:'Mô phỏng: China physical premium changes; check SMM/Fastmarkets before Europe/US session', source:'Workflow reminder', time:'Live check', url:'https://www.metal.com/', category:'China', score:5, summary:'Physical China là nguồn ngoài còn cần giữ hằng ngày.'}
      ];
    }

    async function loadNewsUpdatePayload() {
      let results=[];
      try{ 
        const [fr, gd] = await Promise.allSettled([fetchFederalRegister(), fetchGdelt()]); 
        if(fr.status==='fulfilled') results.push(...fr.value); 
        if(gd.status==='fulfilled') results.push(...gd.value); 
      } catch(e){}
      
      results.push(...mockCoreFeed());
      const liveFeeds = results.sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,25);
      
      return {
        success: true,
        sheet: 'NewsUpdate',
        updatedAt: new Date().toLocaleString('vi-VN'),
        count: liveFeeds.length,
        feeds: liveFeeds
      };
    }

    function updateDeskFeeds() {
      const query = normalize(searchInput.value);
      const catBox = document.getElementById('deskFeedCategory');
      const cat = catBox ? catBox.value : liveFeedsCategory;
      
      const feeds = window.deskCurrentFeeds || [];
      const filtered = feeds.filter(f => {
        if (cat !== 'Tất cả' && f.category !== cat) return false;
        if (!query) return true;
        const text = normalize([f.title, f.summary, f.source, f.category].join(' '));
        return text.includes(query);
      });

      const box = document.getElementById('deskFeedList');
      if (!box) return;

      if (!filtered.length) {
        box.innerHTML = '<div class="empty" style="padding:20px;">Không có feed phù hợp.</div>';
        return;
      }

      box.innerHTML = filtered.map(f => {
        const isHighRisk = f.score >= 5;
        const scoreClass = f.score >= 5 ? 'high' : (f.score >= 3 ? 'med' : 'low');
        const blinkClass = f.score >= 7 ? 'blink-card' : '';
        return `<article class="feed-card ${blinkClass} ${isHighRisk ? 'high-risk' : ''}" style="margin-bottom:12px;">
                 <div class="feed-header">
                   <a href="${escapeHtml(f.url)}" target="_blank" class="feed-title">${escapeHtml(f.title)}</a>
                   <span class="feed-score score-${scoreClass}">Score ${f.score}</span>
                 </div>
                 <div class="feed-meta">
                   <span class="feed-badge">${escapeHtml(f.source)}</span>
                   <span class="feed-badge">${escapeHtml(f.category)}</span>
                   <span class="feed-time">${escapeHtml(f.time)}</span>
                 </div>
                 <p class="feed-summary">${escapeHtml(f.summary || '')}</p>
               </article>`;
      }).join('');
    }

    function renderDeskSourceTabs() {

      if (!box) return;
      box.innerHTML = SOURCE_CATEGORIES.map(c => 
        `<button class="desk-tab ${c === deskSourceCategory ? 'active' : ''}" onclick="deskSourceCategory='${c}'; renderDeskSourceTabs(); renderDeskSources();">${c}</button>`
      ).join('');
    }

    function renderDeskSources() {
      const box = document.getElementById('deskSourceGrid');
      if (!box) return;
      const q = normalize(deskSourceQuery);
      const data = SOURCES.filter(s => (deskSourceCategory === 'Tất cả' || s.group === deskSourceCategory) && normalize([s.name,s.use,s.frequency,s.group,s.mode].join(' ')).includes(q));
      
      box.innerHTML = data.map(s => {
        const pClass = s.priority.includes('Rất cao') ? 'pri-high' : s.priority.includes('Cao') ? 'pri-med' : 'pri-low';
        return `<div class="source-item">
          <div class="source-header">
            <h3 class="source-name">${escapeHtml(s.name)}</h3>
            <span class="source-priority ${pClass}">${escapeHtml(s.priority)}</span>
          </div>
          <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">
            <span class="desk-pill">${escapeHtml(s.group)}</span>
            <span class="desk-pill">${escapeHtml(s.frequency)}</span>
          </div>
          <p class="source-use">${escapeHtml(s.use)}</p>
          <p class="source-mode"><b>API/License:</b> ${escapeHtml(s.mode)}</p>
          <div class="source-actions">
            <a href="${escapeHtml(s.url)}" target="_blank" class="source-btn btn-open">Mở nguồn</a>

      }).join('');
    }

    function renderDeskWorkflows() {
      const box = document.getElementById('deskWorkflowList');

          <div class="wf-content">

            <div class="wf-body">${escapeHtml(r.body)}</div>
            <div class="wf-source"><b>Nguồn:</b> ${escapeHtml(r.source)}</div>

      ).join('');

    function renderDeskAlerts() {
      const box = document.getElementById('deskAlerts');
      if (!box) return;
      box.innerHTML = ALERT_RULES.map(r => {
        const cls = r.color === 'red' ? 'rule-red' : r.color === 'amber' ? 'rule-amber' : 'rule-slate';
        return `<div class="alert-rule ${cls}">

          <div class="rule-impact">${escapeHtml(r.impact)}</div>

    function deskChecklistState() {
      const key = 'stavian_desk_checklist_' + new Date().toISOString().slice(0,10);
      return { key, data: JSON.parse(localStorage.getItem(key) || '{}') };

    function renderDeskChecklist() {
      const box = document.getElementById('deskChecklist');
      if (!box) return;
      const { data } = deskChecklistState();
      box.innerHTML = CHECKLIST.map((t, i) => 
        `<label class="checklist-item ${data[i] ? 'done' : ''}">
          <input type="checkbox" ${data[i] ? 'checked' : ''} onchange="deskToggleChecklist(${i}, this.checked)">
          <span>${escapeHtml(t)}</span>
        </label>`
      ).join('');
    }

    function deskToggleChecklist(i, val) {
      const s = deskChecklistState();
      s.data[i] = val;
      localStorage.setItem(s.key, JSON.stringify(s.data));
      renderDeskChecklist();
    }

    function deskResetChecklist() {
      const s = deskChecklistState();
      localStorage.removeItem(s.key);
      renderDeskChecklist();
    }

    function renderDeskReduced() {
      const box = document.getElementById('deskReducedGrid');
      if (!box) return;

        `<div class="reduced-item">

          <div class="red-action">${escapeHtml(s.action)}</div>
          <div class="red-reason">${escapeHtml(s.reason)}</div>
        </div>`
      ).join('');

    function deskAddNote(name) {
      const ta = document.getElementById('deskNotes');
      if (!ta) return;
      ta.value += '\\n[' + new Date().toLocaleString('vi-VN') + '] Cần check nguồn: ' + name + '\\n';

    function deskCopyTemplate() {
      const el = document.getElementById('deskTemplateText');
      if (!el) return;
      navigator.clipboard.writeText(el.value);
      alert('Đã copy mẫu báo team!');
    }

              function formatDateVN(dateStr) {
      if (!dateStr) return '';
              const parts = String(dateStr).split('-');
              if (parts.length !== 3) return String(dateStr);
              return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

              function parseDateForSort(dateStr) {
      const parts = String(dateStr || '').split('/');
              return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : String(dateStr || '');
    }

    function normalize(value) {
      return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    loadSheet('News');
  </script>
